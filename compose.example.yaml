# Next to subtrans: mount its data folder read-only. The dashboard never writes to it.
services:
  subtitle-dashboard:
    image: subtitle-dashboard:0.1.0 # built locally: docker build -t subtitle-dashboard:0.1.0 .
    container_name: subtitle-dashboard
    user: "1000:1000" # must be able to read costs.jsonl and state.json
    environment:
      - TZ=Europe/Amsterdam
      - EUR_PER_USD=0.86 # same rate as subtrans
    volumes:
      - ./config/subtrans:/data:ro
    ports:
      - "127.0.0.1:8795:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
