# cargo-deny: known vulnerabilities, licences and where crates come from.
[advisories]
yanked = "deny"

[licenses]
# This crate itself is never published (publish = false in Cargo.toml).
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
